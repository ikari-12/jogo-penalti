<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo de Pênalti</title>

<style>
body {
    margin: 0;
    background: #0b6623;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

#campo {
    position: relative;
    width: 800px;
    height: 500px;
    background: linear-gradient(#1e7f34, #146622);
    border: 4px solid white;
    overflow: hidden;
}

/* Gol */
#gol {
    position: absolute;
    top: 30px;
    left: 200px;
    width: 400px;
    height: 150px;
    border: 6px solid white;
    box-sizing: border-box;
}

/* Rede */
#rede {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.4) 0px,
        rgba(255,255,255,0.4) 2px,
        transparent 2px,
        transparent 20px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0px,
        rgba(255,255,255,0.4) 2px,
        transparent 2px,
        transparent 20px
    );
}

/* Goleiro */
#goleiro {
    position: absolute;
    top: 90px;
    left: 370px;
    width: 60px;
    height: 80px;
    background: blue;
    border-radius: 10px;
    transition: left 0.4s ease;
}

/* Bola */
#bola {
    position: absolute;
    bottom: 40px;
    left: 380px;
    width: 40px;
    height: 40px;
    background: white;
    border-radius: 50%;
    border: 3px solid black;
    transition: all 0.5s ease;
}

#mensagem {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="campo">
    <div id="gol">
        <div id="rede"></div>
    </div>

    <div id="goleiro"></div>
    <div id="bola"></div>
    <div id="mensagem"></div>
</div>

<script>
const bola = document.getElementById("bola");
const goleiro = document.getElementById("goleiro");
const mensagem = document.getElementById("mensagem");

let podeChutar = true;

function moverGoleiro() {
    const posicoes = [250, 370, 490];
    const escolha = posicoes[Math.floor(Math.random() * 3)];
    goleiro.style.left = escolha + "px";
    return escolha;
}

function chutar() {
    if (!podeChutar) return;
    podeChutar = false;

    mensagem.textContent = "";

    const direcoes = [250, 370, 490];
    const chute = direcoes[Math.floor(Math.random() * 3)];

    const defesa = moverGoleiro();

    // Anima bola
    bola.style.bottom = "300px";
    bola.style.left = chute + "px";

    setTimeout(() => {
        if (chute === defesa) {
            mensagem.textContent = "DEFENDEU!";
        } else {
            mensagem.textContent = "GOOOL!";
        }

        // Reset bola
        bola.style.bottom = "40px";
        bola.style.left = "380px";

        podeChutar = true;

    }, 800);
}

document.addEventListener("click", chutar);
</script>

</body>
</html>
