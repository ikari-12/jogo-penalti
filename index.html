<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Convite Especial</title>
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    text-align:center;
    background:linear-gradient(#87ceeb,#2e8b57);
}

canvas{
    display:block;
    margin:auto;
    background:transparent;
}

#placar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
}

#pergunta{
    position:absolute;
    top:-200px;
    width:100%;
    font-size:36px;
    font-weight:bold;
    transition:1s;
    display:none;
}

.botao{
    position:absolute;
    bottom:100px;
    width:120px;
    height:60px;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    display:none;
}

#sim{
    right:20px;
    background:lime;
}

#nao{
    left:20px;
    background:red;
    color:white;
}

#final{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    font-size:28px;
    font-weight:bold;
    display:none;
    white-space:pre-line;
}

.confete{
    position:absolute;
    width:8px;
    height:8px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{ transform:translateY(-10px); }
    to{ transform:translateY(100vh); }
}
</style>
</head>
<body>

<div id="placar">Gols: 0/10</div>
<div id="pergunta">Você aceita ser nosso paraninfo?</div>
<button id="sim" class="botao">SIM</button>
<button id="nao" class="botao">NÃO</button>
<div id="final"></div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bolaX = 200;
let bolaY = 500;
let gols = 0;
let perguntaAtiva = false;

function desenhar(){
    ctx.clearRect(0,0,400,600);

    // Traves (sem trave inferior)
    ctx.strokeStyle="white";
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(100,120);
    ctx.lineTo(300,120);
    ctx.moveTo(100,120);
    ctx.lineTo(100,220);
    ctx.moveTo(300,120);
    ctx.lineTo(300,220);
    ctx.stroke();

    // Bola
    ctx.beginPath();
    ctx.fillStyle="white";
    ctx.arc(bolaX,bolaY,15,0,Math.PI*2);
    ctx.fill();
}

desenhar();

canvas.addEventListener("click", chutar);
canvas.addEventListener("touchstart", chutar);

function chutar(e){
    if(perguntaAtiva) return;

    let rect = canvas.getBoundingClientRect();
    let x = e.touches ? e.touches[0].clientX : e.clientX;
    x -= rect.left;

    bolaX = x;
    bolaY = 150;
    desenhar();

    setTimeout(()=>{
        gols++;
        document.getElementById("placar").innerText="Gols: "+gols+"/10";
        resetar();

        if(gols === 10){
            ativarPergunta();
        }

    },400);
}

function resetar(){
    bolaX = 200;
    bolaY = 500;
    desenhar();
}

function ativarPergunta(){
    perguntaAtiva = true;

    const pergunta = document.getElementById("pergunta");
    pergunta.style.display="block";
    pergunta.style.top="40%";

    setTimeout(()=>{
        pergunta.style.top="20px";
        document.getElementById("sim").style.display="block";
        document.getElementById("nao").style.display="block";
    },1000);
}

document.getElementById("nao").onclick = function(){
    alert("Não aceitamos não como resposta! Responda novamente.");
};

document.getElementById("sim").onclick = function(){

    // esconder tudo
    canvas.style.display="none";
    document.getElementById("placar").style.display="none";
    document.getElementById("pergunta").style.display="none";
    document.getElementById("sim").style.display="none";
    document.getElementById("nao").style.display="none";

    // mostrar mensagem final
    const final = document.getElementById("final");
    final.innerText =
`É uma honra termos o senhor como nosso paraninfo!!

A contagem regressiva para o grande dia começa agora!

Te esperamos dia 25/05/2026 às 19h
no Instituto Federal Fluminense
Campus Campos Guarus!`;

    final.style.display="block";

    iniciarConfete();
};

function iniciarConfete(){
    setInterval(()=>{
        const c = document.createElement("div");
        c.classList.add("confete");
        c.style.left = Math.random()*100 + "vw";
        c.style.background = "hsl(" + Math.random()*360 + ",100%,50%)";
        c.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(c);
    },100);
}
</script>

</body>
</html>
