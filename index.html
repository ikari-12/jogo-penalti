<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo de Pênalti 2D</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#2ecc71;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* CAMPO */
.campo{
    position:relative;
    width:90%;
    max-width:800px;
    height:450px;
    background:#27ae60;
    border:5px solid white;
    margin-top:20px;
    overflow:hidden;
}

/* GOL */
.gol{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:40%;
    height:100px;
    border:5px solid white;
}

/* GOLEIRO */
.goleiro{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:80px;
    background:blue;
    transition:0.4s ease;
}

/* BOLA */
.bola{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    transition:0.4s ease;
}

button{
    margin:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#resultado{
    font-size:26px;
    color:white;
    margin-top:10px;
    height:40px;
}

</style>
</head>
<body>

<h1>⚽ Jogo de Pênalti 2D</h1>

<div class="campo">

    <div class="gol"></div>

    <div class="goleiro" id="goleiro"></div>

    <div class="bola" id="bola">⚽</div>

</div>

<div>
    <button onclick="chutar('esquerda')">Esquerda</button>
    <button onclick="chutar('centro')">Centro</button>
    <button onclick="chutar('direita')">Direita</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;

function chutar(direcao){

    if(animando) return;
    animando = true;

    const goleiro = document.getElementById("goleiro");
    const bola = document.getElementById("bola");
    const resultado = document.getElementById("resultado");

    const opcoes = ["esquerda","centro","direita"];
    const defesa = opcoes[Math.floor(Math.random()*3)];

    resultado.innerHTML = "";

    // RESET INICIAL
    goleiro.style.left = "50%";
    bola.style.left = "50%";
    bola.style.bottom = "30px";

    setTimeout(()=>{

        // MOVIMENTO DA BOLA
        if(direcao === "esquerda") bola.style.left = "30%";
        if(direcao === "direita") bola.style.left = "70%";

        bola.style.bottom = "300px";

        // MOVIMENTO DO GOLEIRO
        if(defesa === "esquerda") goleiro.style.left = "30%";
        if(defesa === "direita") goleiro.style.left = "70%";

    },100);

    setTimeout(()=>{

        if(direcao === defesa){
            resultado.innerHTML = "🧤 DEFENDEU!";
        }else{
            resultado.innerHTML = "⚽ GOOOOOL!";
        }

    },600);

    // RESET FINAL
    setTimeout(()=>{

        goleiro.style.left = "50%";
        bola.style.left = "50%";
        bola.style.bottom = "30px";
        resultado.innerHTML = "";

        animando = false;

    },1500);

}

</script>

</body>
</html>
