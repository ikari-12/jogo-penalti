<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Penalti Especial</title>
<style>
body{
    margin:0;
    background:linear-gradient(to top,#2e8b57 60%,#87ceeb 60%);
    overflow:hidden;
    font-family:Arial;
    text-align:center;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    font-size:24px;
    font-weight:bold;
}

#question{
    position:absolute;
    width:100%;
    top:40%;
    font-size:40px;
    font-weight:bold;
    display:none;
    transition:all 1s ease;
}

#answerLeft,#answerRight{
    position:absolute;
    top:55%;
    font-size:30px;
    font-weight:bold;
    display:none;
    cursor:pointer;
}

#answerLeft{ left:20%; }
#answerRight{ right:20%; }

#message{
    position:absolute;
    width:100%;
    top:45%;
    font-size:45px;
    font-weight:bold;
    display:none;
}

#field{
    position:absolute;
    bottom:0;
    width:100%;
    height:300px;
}

#goal{
    position:absolute;
    bottom:250px;
    left:50%;
    transform:translateX(-50%);
    width:300px;
    height:150px;
}

.post{
    position:absolute;
    background:white;
}

#leftPost{
    width:10px;
    height:150px;
    left:0;
}

#rightPost{
    width:10px;
    height:150px;
    right:0;
}

#crossbar{
    width:300px;
    height:10px;
    top:0;
}

#goalkeeper{
    position:absolute;
    bottom:250px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:80px;
    background:red;
    border-radius:10px;
    transition:0.4s;
}

#ball{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:40px;
    background:white;
    border-radius:50%;
    transition:0.5s;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    background:random;
    animation:fall 100s linear infinite;
}

@keyframes fall{
    from{ transform:translateY(-100px) rotate(0deg);}
    to{ transform:translateY(800px) rotate(360deg);}
}
</style>
</head>

<body>

<div id="score">Gols: 0 / 10</div>

<div id="question">Você aceita ser nosso paraninfo?</div>
<div id="answerLeft">NÃO</div>
<div id="answerRight">SIM</div>

<div id="message"></div>

<div id="goal">
    <div id="leftPost" class="post"></div>
    <div id="rightPost" class="post"></div>
    <div id="crossbar" class="post"></div>
</div>

<div id="goalkeeper"></div>
<div id="ball"></div>

<script>

let gols = 0;
let podeChutar = true;
let perguntaAtiva = false;

const ball = document.getElementById("ball");
const keeper = document.getElementById("goalkeeper");
const score = document.getElementById("score");
const question = document.getElementById("question");
const answerLeft = document.getElementById("answerLeft");
const answerRight = document.getElementById("answerRight");
const message = document.getElementById("message");

function resetBall(){
    ball.style.left="50%";
    ball.style.bottom="80px";
    ball.style.transform="translateX(-50%)";
    keeper.style.left="50%";
}

function mostrarPergunta(){
    perguntaAtiva=true;
    question.style.display="block";
    question.style.top="40%";
    question.style.fontSize="40px";

    setTimeout(()=>{
        question.style.top="10px";
        question.style.fontSize="24px";
        answerLeft.style.display="block";
        answerRight.style.display="block";
    },1000);
}

function criarConfete(){
    for(let i=0;i<100;i++){
        let conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left=Math.random()*window.innerWidth+"px";
        conf.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
        conf.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(conf);
    }
}

function chutar(lado){
    if(!podeChutar) return;
    podeChutar=false;

    ball.style.bottom="260px";
    ball.style.left=lado==="left"?"35%":lado==="right"?"65%":"50%";

    setTimeout(()=>{

        if(perguntaAtiva){

            if(lado==="right"){
                message.innerText="VOCÊ É O MELHOR!";
                message.style.display="block";
                criarConfete();
            }else{
                message.innerText="Não aceitamos NÃO como resposta! Responda novamente.";
                message.style.display="block";
                keeper.style.left="35%";
                setTimeout(()=>{ keeper.style.left="50%"; },500);
            }

            setTimeout(()=>{
                message.style.display="none";
                resetBall();
                podeChutar=true;
            },2000);

        }else{

            gols++;
            score.innerText="Gols: "+gols+" / 10";

            if(gols===10){
                mostrarPergunta();
            }

            resetBall();
            podeChutar=true;
        }

    },500);
}

document.addEventListener("click",(e)=>{
    if(!perguntaAtiva){
        if(e.clientX<window.innerWidth/2) chutar("left");
        else chutar("right");
    }else{
        if(e.clientX<window.innerWidth/2) chutar("left");
        else chutar("right");
    }
});

</script>

</body>
</html>
