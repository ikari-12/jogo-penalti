<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Pênalti PRO</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to top, #2ecc71 70%, #87ceeb 30%);
            overflow: hidden;
        }

        h1 {
            color: white;
            margin-top: 10px;
        }

        .campo {
            position: relative;
            width: 700px;
            height: 450px;
            margin: 20px auto;
            background: #27ae60;
            border: 4px solid white;
            border-bottom: none;
        }

        .gol {
            position: absolute;
            top: 40px;
            left: 200px;
            width: 300px;
            height: 150px;
            border: 5px solid white;
        }

        /* GOLEIRO HUMANO */
        .goleiro {
            position: absolute;
            top: 120px;
            left: 330px;
            width: 40px;
            height: 120px;
            transition: all 0.4s ease;
        }

        .cabeca {
            width: 35px;
            height: 35px;
            background: #f1c27d;
            border-radius: 50%;
            margin: auto;
        }

        .corpo {
            width: 30px;
            height: 50px;
            background: blue;
            margin: auto;
        }

        .bracos {
            position: absolute;
            top: 40px;
            left: -20px;
            width: 80px;
            height: 10px;
            background: blue;
        }

        .pernas {
            width: 30px;
            height: 40px;
            background: black;
            margin: auto;
        }

        .bola {
            position: absolute;
            bottom: 40px;
            left: 340px;
            font-size: 45px;
            transition: all 0.4s ease;
        }

        .botoes {
            margin-top: 15px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #resultado {
            font-size: 28px;
            color: white;
            margin-top: 10px;
            height: 40px;
        }

    </style>
</head>
<body>

<h1>⚽ Jogo de Pênalti PRO</h1>

<div class="campo">
    <div class="gol"></div>

    <div class="goleiro" id="goleiro">
        <div class="cabeca"></div>
        <div class="corpo"></div>
        <div class="bracos"></div>
        <div class="pernas"></div>
    </div>

    <div class="bola" id="bola">⚽</div>
</div>

<div class="botoes">
    <button onclick="chutar('esquerda')" id="btn1">Esquerda</button>
    <button onclick="chutar('centro')" id="btn2">Centro</button>
    <button onclick="chutar('direita')" id="btn3">Direita</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;

function desativarBotoes(valor){
    btn1.disabled = valor;
    btn2.disabled = valor;
    btn3.disabled = valor;
}

function chutar(direcaoJogador){

    if(animando) return;
    animando = true;
    desativarBotoes(true);

    const goleiro = document.getElementById("goleiro");
    const bola = document.getElementById("bola");
    const resultado = document.getElementById("resultado");

    const opcoes = ['esquerda','centro','direita'];
    const direcaoGoleiro = opcoes[Math.floor(Math.random()*3)];

    resultado.innerHTML = "";

    goleiro.style.left = "330px";
    goleiro.style.transform = "rotate(0deg)";
    bola.style.left = "340px";
    bola.style.bottom = "40px";

    setTimeout(()=>{

        if(direcaoJogador === "esquerda") bola.style.left = "250px";
        if(direcaoJogador === "centro") bola.style.left = "340px";
        if(direcaoJogador === "direita") bola.style.left = "430px";

        bola.style.bottom = "260px";

        if(direcaoGoleiro === "esquerda"){
            goleiro.style.left = "250px";
            goleiro.style.transform = "rotate(-25deg)";
        }
        if(direcaoGoleiro === "centro"){
            goleiro.style.left = "330px";
        }
        if(direcaoGoleiro === "direita"){
            goleiro.style.left = "410px";
            goleiro.style.transform = "rotate(25deg)";
        }

    },100);

    setTimeout(()=>{

        if(direcaoJogador === direcaoGoleiro){
            resultado.innerHTML = "🧤 DEFENDEU!";
        } else {
            resultado.innerHTML = "⚽ GOOOOOL!";
        }

    },500);

    setTimeout(()=>{

        goleiro.style.left = "330px";
        goleiro.style.transform = "rotate(0deg)";
        bola.style.left = "340px";
        bola.style.bottom = "40px";

        animando = false;
        desativarBotoes(false);

    },1000);
}

</script>

</body>
</html>
