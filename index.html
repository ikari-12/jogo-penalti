<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Pênalti PRO</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to top, #2ecc71 70%, #87ceeb 30%);
            overflow: hidden;
        }

        h1 { color: white; margin-top: 10px; }

        #placar { font-size: 24px; color: yellow; }

        #meta { color: white; font-size: 18px; margin-bottom: 10px; }

        .campo {
            position: relative;
            width: 700px;
            height: 450px;
            margin: 20px auto;
            background: #27ae60;
            border: 4px solid white;
            border-bottom: none;
        }

        /* GOL SEM TRAVE INFERIOR */
        .gol {
            position: absolute;
            top: 40px;
            left: 200px;
            width: 300px;
            height: 150px;
            border-left: 5px solid white;
            border-right: 5px solid white;
            border-top: 5px solid white;
        }

        .goleiro {
            position: absolute;
            top: 120px;
            left: 330px;
            width: 40px;
            height: 120px;
            transition: all 0.4s ease;
        }

        .cabeca {
            width: 35px;
            height: 35px;
            background: #f1c27d;
            border-radius: 50%;
            margin: auto;
        }

        .corpo {
            width: 30px;
            height: 50px;
            background: blue;
            margin: auto;
        }

        .bracos {
            position: absolute;
            top: 40px;
            left: -20px;
            width: 80px;
            height: 10px;
            background: blue;
        }

        .pernas {
            width: 30px;
            height: 40px;
            background: black;
            margin: auto;
        }

        .bola {
            position: absolute;
            bottom: 40px;
            left: 340px;
            font-size: 45px;
            transition: all 0.4s ease;
        }

        .botoes { margin-top: 15px; }

        button {
            padding: 10px 25px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }

        button:disabled { opacity: 0.5; }

        #resultado {
            font-size: 24px;
            color: white;
            margin-top: 10px;
            min-height: 40px;
        }

        /* PERGUNTA GRANDE */
        #perguntaGrande {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
            color: white;
            display: none;
            z-index: 10;
            transition: all 1s ease;
        }

        /* CONFETE */
        .confete {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: cair linear forwards;
        }

        @keyframes cair {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

    </style>
</head>
<body>

<h1>⚽ Jogo de Pênalti PRO</h1>
<div id="placar">Gols: 0</div>
<div id="meta">Faça 10 gols para desbloquear a pergunta</div>

<div id="perguntaGrande"></div>

<div class="campo">
    <div class="gol"></div>

    <div class="goleiro" id="goleiro">
        <div class="cabeca"></div>
        <div class="corpo"></div>
        <div class="bracos"></div>
        <div class="pernas"></div>
    </div>

    <div class="bola" id="bola">⚽</div>
</div>

<div class="botoes">
    <button onclick="chutar('esquerda')" id="btn1">Esquerda (NÃO)</button>
    <button onclick="chutar('centro')" id="btn2">Centro</button>
    <button onclick="chutar('direita')" id="btn3">Direita (SIM)</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;
let gols = 0;
let modoPergunta = false;

function desativarBotoes(valor){
    btn1.disabled = valor;
    btn2.disabled = valor;
    btn3.disabled = valor;
}

function resetar(){
    goleiro.style.left = "330px";
    goleiro.style.transform = "rotate(0deg)";
    bola.style.left = "340px";
    bola.style.bottom = "40px";
}

function mostrarPerguntaAnimada(){
    const pergunta = document.getElementById("perguntaGrande");
    pergunta.innerHTML = "Você aceita ser nosso parainfo?";
    pergunta.style.display = "block";

    setTimeout(()=>{
        pergunta.style.top = "60px";
        pergunta.style.transform = "translateX(-50%)";
    },1000);

    modoPergunta = true;
}

function confete(){
    for(let i=0;i<100;i++){
        const c = document.createElement("div");
        c.classList.add("confete");
        c.style.left = Math.random()*100 + "vw";
        c.style.background = `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(c);

        setTimeout(()=>{ c.remove(); },5000);
    }
}

function chutar(direcaoJogador){

    if(animando) return;
    animando = true;
    desativarBotoes(true);
    resultado.innerHTML = "";
    resetar();

    let direcaoGoleiro;

    if(modoPergunta){
        if(direcaoJogador === "esquerda"){
            direcaoGoleiro = "esquerda";
        } else {
            direcaoGoleiro = "centro";
        }
    } else {
        const opcoes = ['esquerda','centro','direita'];
        direcaoGoleiro = opcoes[Math.floor(Math.random()*3)];
    }

    setTimeout(()=>{

        if(direcaoJogador === "esquerda") bola.style.left = "250px";
        if(direcaoJogador === "centro") bola.style.left = "340px";
        if(direcaoJogador === "direita") bola.style.left = "430px";

        bola.style.bottom = "260px";

        if(direcaoGoleiro === "esquerda"){
            goleiro.style.left = "250px";
        }
        if(direcaoGoleiro === "centro"){
            goleiro.style.left = "330px";
        }
        if(direcaoGoleiro === "direita"){
            goleiro.style.left = "410px";
        }

    },100);

    setTimeout(()=>{

        if(modoPergunta){

            if(direcaoJogador === "esquerda"){
                resultado.innerHTML = "Não aceitamos NÃO como resposta 😏";
            } 
            else if(direcaoJogador === "direita"){
                const pergunta = document.getElementById("perguntaGrande");
                pergunta.style.top = "50%";
                pergunta.style.transform = "translate(-50%, -50%)";
                pergunta.innerHTML = "🎉 VOCÊ É O MELHOR!";
                confete();
            }

        } else {

            if(direcaoJogador === direcaoGoleiro){
                resultado.innerHTML = "🧤 DEFENDEU!";
            } else {
                resultado.innerHTML = "⚽ GOOOOOL!";
                gols++;
                document.getElementById("placar").innerHTML = "Gols: " + gols;

                if(gols === 10){
                    mostrarPerguntaAnimada();
                }
            }

        }

    },500);

    setTimeout(()=>{
        resetar();
        animando = false;
        desativarBotoes(false);
    },1000);
}

</script>

</body>
</html>
