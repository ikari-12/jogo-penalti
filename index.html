<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Pênalti</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #2ecc71;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        .campo {
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #resultado {
            font-size: 24px;
            margin-top: 20px;
        }

        #placar {
            font-size: 22px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>⚽ Jogo de Pênalti</h1>

    <div class="campo">
        <p>Escolha onde chutar:</p>

        <button onclick="chutar('esquerda')">Esquerda</button>
        <button onclick="chutar('centro')">Centro</button>
        <button onclick="chutar('direita')">Direita</button>
    </div>

    <div id="resultado"></div>
    <div id="placar">Gols: 0 | Defesas: 0</div>

<script>

let gols = 0;
let defesas = 0;

function chutar(direcaoJogador) {

    let opcoes = ['esquerda', 'centro', 'direita'];
    let direcaoGoleiro = opcoes[Math.floor(Math.random() * 3)];

    if(direcaoJogador === direcaoGoleiro){
        defesas++;
        document.getElementById("resultado").innerHTML = "🧤 O goleiro defendeu!";
    } else {
        gols++;
        document.getElementById("resultado").innerHTML = "⚽ GOOOOOL!";
    }

    document.getElementById("placar").innerHTML =
        "Gols: " + gols + " | Defesas: " + defesas;
}

</script>

</body>
</html>
