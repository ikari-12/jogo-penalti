<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jogo de Pênalti Especial</title>
<style>
body{
    margin:0;
    background:linear-gradient(#87ceeb,#2e8b57);
    overflow:hidden;
    font-family:Arial;
    text-align:center;
    touch-action: manipulation;
}

canvas{
    display:block;
    margin:auto;
    background:transparent;
}

#placar{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    font-weight:bold;
}

#mensagem{
    position:absolute;
    top:40%;
    width:100%;
    font-size:40px;
    font-weight:bold;
    display:none;
}

#pergunta{
    position:absolute;
    top:-200px;
    width:100%;
    font-size:38px;
    font-weight:bold;
    transition:1s;
    display:none;
}

.botaoPergunta{
    position:absolute;
    bottom:100px;
    width:120px;
    height:60px;
    font-size:22px;
    font-weight:bold;
    display:none;
    border:none;
    border-radius:10px;
}

#sim{ right:20px; background:lime; }
#nao{ left:20px; background:red; color:white; }

.confete{
    position:absolute;
    width:8px;
    height:8px;
    animation:cair linear infinite;
}

@keyframes cair{
    from{ transform:translateY(-10px); }
    to{ transform:translateY(100vh); }
}
</style>
</head>
<body>

<div id="placar">Gols: 0/10</div>
<div id="mensagem"></div>
<div id="pergunta">Você aceita ser nosso paraninfo?</div>
<button id="sim" class="botaoPergunta">SIM</button>
<button id="nao" class="botaoPergunta">NÃO</button>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bolaX = 200;
let bolaY = 500;
let gols = 0;
let fasePergunta = false;

function desenharCampo(){
    ctx.clearRect(0,0,400,600);

    // Traves
    ctx.strokeStyle="white";
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(100,100);
    ctx.lineTo(300,100);
    ctx.lineTo(300,200);
    ctx.moveTo(100,100);
    ctx.lineTo(100,200);
    ctx.stroke();

    // Bola
    ctx.beginPath();
    ctx.fillStyle="white";
    ctx.arc(bolaX,bolaY,15,0,Math.PI*2);
    ctx.fill();
}

desenharCampo();

canvas.addEventListener("click",chutar);
canvas.addEventListener("touchstart",chutar);

function chutar(e){
    if(fasePergunta) return;

    let alvoX = e.touches ? e.touches[0].clientX : e.clientX;
    let rect = canvas.getBoundingClientRect();
    alvoX -= rect.left;

    bolaY = 120;
    bolaX = alvoX;

    setTimeout(()=>{
        gols++;
        document.getElementById("placar").innerText="Gols: "+gols+"/10";
        resetarBola();
        if(gols==10){
            ativarPergunta();
        }
    },500);

    desenharCampo();
}

function resetarBola(){
    bolaX=200;
    bolaY=500;
    desenharCampo();
}

function ativarPergunta(){
    fasePergunta=true;

    const pergunta=document.getElementById("pergunta");
    pergunta.style.display="block";
    pergunta.style.top="40%";

    setTimeout(()=>{
        pergunta.style.top="10px";
        document.getElementById("sim").style.display="block";
        document.getElementById("nao").style.display="block";
    },1000);
}

document.getElementById("nao").onclick=function(){
    document.getElementById("mensagem").innerText=
    "Não aceitamos não como resposta! Responda novamente, você aceita?";
    document.getElementById("mensagem").style.display="block";
};

document.getElementById("sim").onclick=function(){
    document.getElementById("mensagem").innerText=
    "É uma honra termos o senhor como nosso paraninfo!!\n\nA contagem regressiva para o grande dia começa agora!\n\nTe esperamos dia 25/05/2026 às 19h no Instituto Federal Fluminense Campus Campos Guarus!";
    document.getElementById("mensagem").style.display="block";
    criarConfete();
};

function criarConfete(){
    setInterval(()=>{
        let confete=document.createElement("div");
        confete.classList.add("confete");
        confete.style.left=Math.random()*100+"vw";
        confete.style.background=
        "hsl("+Math.random()*360+",100%,50%)";
        confete.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(confete);
    },100);
}
</script>

</body>
</html>
