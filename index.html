<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo de Pênalti</title>

<style>
body {
    margin: 0;
    background: #0b6623;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

#campo {
    position: relative;
    width: 800px;
    height: 500px;
    background: linear-gradient(#1e7f34, #146622);
    border: 4px solid white;
    overflow: hidden;
}

/* Gol */
#gol {
    position: absolute;
    top: 30px;
    left: 200px;
    width: 400px;
    height: 150px;
    border: 6px solid white;
    box-sizing: border-box;
}

#rede {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.4) 0px,
        rgba(255,255,255,0.4) 2px,
        transparent 2px,
        transparent 20px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0px,
        rgba(255,255,255,0.4) 2px,
        transparent 2px,
        transparent 20px
    );
}

/* Goleiro humano */
#goleiro {
    position: absolute;
    top: 80px;
    left: 370px;
    width: 60px;
    height: 120px;
    transition: all 0.4s ease;
}

/* Corpo */
.corpo {
    position: absolute;
    top: 30px;
    left: 15px;
    width: 30px;
    height: 60px;
    background: blue;
    border-radius: 8px;
}

/* Cabeça */
.cabeca {
    position: absolute;
    top: 0;
    left: 20px;
    width: 20px;
    height: 20px;
    background: #ffcc99;
    border-radius: 50%;
}

/* Braços */
.braco {
    position: absolute;
    top: 35px;
    width: 15px;
    height: 8px;
    background: blue;
}

.braco.esquerdo {
    left: 0;
}

.braco.direito {
    right: 0;
}

/* Pernas */
.perna {
    position: absolute;
    bottom: 0;
    width: 10px;
    height: 40px;
    background: black;
}

.perna.esquerda {
    left: 15px;
}

.perna.direita {
    right: 15px;
}

/* Bola */
#bola {
    position: absolute;
    bottom: 40px;
    left: 380px;
    width: 40px;
    height: 40px;
    background: white;
    border-radius: 50%;
    border: 3px solid black;
    transition: all 0.6s ease;
}

/* Rotação da bola */
.girar {
    animation: girarBola 0.6s linear;
}

@keyframes girarBola {
    from { transform: rotate(0deg); }
    to { transform: rotate(720deg); }
}

#mensagem {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="campo">
    <div id="gol">
        <div id="rede"></div>
    </div>

    <div id="goleiro">
        <div class="cabeca"></div>
        <div class="corpo"></div>
        <div class="braco esquerdo"></div>
        <div class="braco direito"></div>
        <div class="perna esquerda"></div>
        <div class="perna direita"></div>
    </div>

    <div id="bola"></div>
    <div id="mensagem"></div>
</div>

<script>
const bola = document.getElementById("bola");
const goleiro = document.getElementById("goleiro");
const mensagem = document.getElementById("mensagem");

let podeChutar = true;

function moverGoleiro() {
    const posicoes = [250, 370, 490];
    const escolha = posicoes[Math.floor(Math.random() * 3)];
    goleiro.style.left = escolha + "px";
    return escolha;
}

function chutar() {
    if (!podeChutar) return;
    podeChutar = false;

    mensagem.textContent = "";

    const direcoes = [250, 370, 490];
    const chute = direcoes[Math.floor(Math.random() * 3)];

    const defesa = moverGoleiro();

    // Bola gira
    bola.classList.add("girar");

    // Bola sobe
    bola.style.bottom = "300px";
    bola.style.left = chute + "px";

    setTimeout(() => {
        if (chute === defesa) {
            mensagem.textContent = "DEFENDEU!";
        } else {
            mensagem.textContent = "GOOOL!";
        }

        // Reset bola
        bola.style.bottom = "40px";
        bola.style.left = "380px";
        bola.classList.remove("girar");

        // Volta goleiro para centro
        goleiro.style.left = "370px";

        podeChutar = true;

    }, 900);
}

document.addEventListener("click", chutar);
</script>

</body>
</html>
