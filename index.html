<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pênalti PRO Mobile</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:Arial;
    background:linear-gradient(to top,#2ecc71 70%,#87ceeb 30%);
    overflow:hidden;
}

h1{color:white;font-size:6vw;}

#placar{font-size:5vw;color:yellow;}

#meta{
    color:white;
    font-size:7vw;
    margin-top:10px;
}

.campo{
    position:relative;
    width:95vw;
    height:60vh;
    margin:auto;
    background:#27ae60;
    border:3px solid white;
    border-bottom:none;
}

.gol{
    position:absolute;
    top:5vh;
    left:20%;
    width:60%;
    height:20vh;
    border-left:4px solid white;
    border-right:4px solid white;
    border-top:4px solid white;
}

.opcao{
    position:absolute;
    top:10vh;
    font-size:7vw;
    font-weight:bold;
    color:white;
    display:none;
    z-index:5;
}

#nao{ left:25%; }
#sim{ right:25%; }

.goleiro{
    position:absolute;
    top:18vh;
    left:45%;
    width:8vw;
    height:18vh;
    transition:0.4s;
}

.cabeca{
    width:8vw;
    height:8vw;
    background:#f1c27d;
    border-radius:50%;
}

.corpo{
    width:6vw;
    height:8vh;
    background:blue;
    margin:auto;
}

.bola{
    position:absolute;
    bottom:5vh;
    left:47%;
    font-size:10vw;
    transition:0.4s;
}

button{
    width:28vw;
    padding:15px;
    font-size:5vw;
    margin:5px;
    border:none;
    border-radius:10px;
}

#resultado{
    font-size:6vw;
    color:white;
    min-height:40px;
}

#vencedor{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:10vw;
    font-weight:bold;
    color:gold;
    display:none;
    z-index:10;
}

.confete{
    position:fixed;
    width:8px;
    height:8px;
    top:-10px;
    animation:cair linear infinite;
}

@keyframes cair{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<h1>⚽ Pênalti PRO</h1>
<div id="placar">Gols: 0</div>
<div id="meta">Faça 10 gols para desbloquear a pergunta</div>

<div class="campo">
    <div class="gol"></div>

    <!-- AGORA FICAM DENTRO DO CAMPO -->
    <div class="opcao" id="nao">NÃO</div>
    <div class="opcao" id="sim">SIM</div>

    <div class="goleiro" id="goleiro">
        <div class="cabeca"></div>
        <div class="corpo"></div>
    </div>

    <div class="bola" id="bola">⚽</div>
</div>

<div>
    <button onclick="chutar('esquerda')">Esquerda</button>
    <button onclick="chutar('centro')">Centro</button>
    <button onclick="chutar('direita')">Direita</button>
</div>

<div id="resultado"></div>
<div id="vencedor">VOCÊ É O MELHOR!</div>

<script>

let gols=0;
let modoPergunta=false;
let animando=false;

const goleiro=document.getElementById("goleiro");
const bola=document.getElementById("bola");
const meta=document.getElementById("meta");
const resultado=document.getElementById("resultado");
const nao=document.getElementById("nao");
const sim=document.getElementById("sim");

function criarConfetes(){
    setInterval(()=>{
        const conf=document.createElement("div");
        conf.classList.add("confete");
        conf.style.left=Math.random()*100+"vw";
        conf.style.backgroundColor="hsl("+Math.random()*360+",100%,50%)";
        conf.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(conf);
    },150);
}

function resetar(){
    goleiro.style.left="45%";
    bola.style.left="47%";
    bola.style.bottom="5vh";
}

function atualizar(){
    document.getElementById("placar").innerHTML="Gols: "+gols;

    if(gols>=10 && !modoPergunta){
        modoPergunta=true;
        meta.innerHTML="VOCÊ ACEITA SER NOSSO PARANINFO?";
        meta.style.fontSize="9vw";

        // FORÇA APARECER
        nao.style.display="block";
        sim.style.display="block";
    }
}

function chutar(dir){

    if(animando) return;
    animando=true;
    resultado.innerHTML="";

    let defesa;

    if(modoPergunta){
        defesa=(dir==="esquerda")?"esquerda":"centro";
    }else{
        const op=["esquerda","centro","direita"];
        defesa=op[Math.floor(Math.random()*3)];
    }

    if(dir==="esquerda") bola.style.left="30%";
    if(dir==="centro") bola.style.left="47%";
    if(dir==="direita") bola.style.left="65%";

    bola.style.bottom="35vh";

    if(defesa==="esquerda") goleiro.style.left="30%";
    if(defesa==="direita") goleiro.style.left="65%";

    setTimeout(()=>{

        if(modoPergunta){

            if(dir==="esquerda"){
                resultado.innerHTML="Não aceitamos NÃO como resposta";
            }else{
                document.getElementById("vencedor").style.display="block";
                criarConfetes();
            }

        }else{

            if(dir!==defesa){
                gols++;
                resultado.innerHTML="⚽ GOOOL!";
                atualizar();
            }else{
                resultado.innerHTML="🧤 DEFENDEU!";
            }

        }

        setTimeout(()=>{
            resetar();
            animando=false;
        },500);

    },400);
}

</script>

</body>
</html>
