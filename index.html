<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pênalti 3D</title>

<style>

body{
    margin:0;
    background:linear-gradient(#87ceeb 50%, #2ecc71 50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:Arial;
}

/* CENA 3D */
.cena{
    perspective:1000px;
    margin-top:20px;
}

/* CAMPO EM 3D */
.campo{
    width:800px;
    height:500px;
    background:repeating-linear-gradient(
        90deg,
        #2ecc71 0px,
        #2ecc71 60px,
        #27ae60 60px,
        #27ae60 120px
    );
    border:5px solid white;
    transform:rotateX(60deg);
    transform-origin:bottom;
    position:relative;
}

/* GOL */
.gol{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    width:250px;
    height:120px;
    border:5px solid white;
    background:rgba(255,255,255,0.1);
}

/* GOLEIRO */
.goleiro{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:100px;
    background:blue;
    transition:0.4s ease;
}

/* BOLA */
.bola{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%) scale(1);
    font-size:40px;
    transition:0.5s ease;
}

button{
    margin:10px;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#resultado{
    font-size:28px;
    margin-top:10px;
    color:white;
}

</style>
</head>
<body>

<h1>⚽ Pênalti 3D</h1>

<div class="cena">
    <div class="campo">

        <div class="gol"></div>
        <div class="goleiro" id="goleiro"></div>
        <div class="bola" id="bola">⚽</div>

    </div>
</div>

<div>
    <button onclick="chutar('esquerda')">Esquerda</button>
    <button onclick="chutar('centro')">Centro</button>
    <button onclick="chutar('direita')">Direita</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;

function chutar(dir){

    if(animando) return;
    animando = true;

    const goleiro = document.getElementById("goleiro");
    const bola = document.getElementById("bola");
    const resultado = document.getElementById("resultado");

    const opcoes=["esquerda","centro","direita"];
    const defesa=opcoes[Math.floor(Math.random()*3)];

    resultado.innerHTML="";

    // RESET
    goleiro.style.left="50%";
    bola.style.left="50%";
    bola.style.bottom="80px";
    bola.style.transform="translateX(-50%) scale(1)";

    setTimeout(()=>{

        if(dir==="esquerda") bola.style.left="35%";
        if(dir==="direita") bola.style.left="65%";

        bola.style.bottom="350px";
        bola.style.transform="translateX(-50%) scale(0.6)";

        if(defesa==="esquerda") goleiro.style.left="35%";
        if(defesa==="direita") goleiro.style.left="65%";

    },100);

    setTimeout(()=>{

        if(dir===defesa){
            resultado.innerHTML="🧤 DEFENDEU!";
        }else{
            resultado.innerHTML="⚽ GOOOOOL!";
        }

        animando=false;

    },700);
}

</script>

</body>
</html>
