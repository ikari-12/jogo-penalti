<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo de Pênalti PRO</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    background:linear-gradient(#87ceeb 40%, #2ecc71 40%);
}

/* CAMPO */
.campo{
    position:relative;
    width:800px;
    height:500px;
    margin:20px auto;
    background:repeating-linear-gradient(
        90deg,
        #2ecc71 0px,
        #2ecc71 60px,
        #27ae60 60px,
        #27ae60 120px
    );
    border:5px solid white;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* GRANDE ÁREA */
.area{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    width:400px;
    height:220px;
    border:4px solid white;
}

/* PEQUENA ÁREA */
.pequena{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    width:200px;
    height:120px;
    border:4px solid white;
}

/* MARCA DO PENALTI */
.marca{
    position:absolute;
    bottom:150px;
    left:50%;
    transform:translateX(-50%);
    width:15px;
    height:15px;
    background:white;
    border-radius:50%;
}

/* GOL */
.gol{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:120px;
    border:6px solid white;
    background:rgba(255,255,255,0.08);
}

/* REDE */
.gol::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    linear-gradient(to right, rgba(255,255,255,0.4) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size:18px 18px;
}

/* GOLEIRO */
.goleiro{
    position:absolute;
    top:130px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    transition:0.4s ease;
}

.cabeca{
    width:35px;
    height:35px;
    background:#f1c27d;
    border-radius:50%;
    margin:auto;
}

.corpo{
    width:30px;
    height:50px;
    background:blue;
    margin:auto;
}

.bracos{
    position:absolute;
    top:40px;
    left:-20px;
    width:80px;
    height:10px;
    background:blue;
}

.pernas{
    width:30px;
    height:40px;
    background:black;
    margin:auto;
}

/* BOLA */
.bola{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    transition:0.4s ease;
}

/* BOTÕES */
.botoes{
    margin-top:15px;
}

button{
    padding:10px 25px;
    font-size:18px;
    margin:5px;
    cursor:pointer;
}

#resultado{
    font-size:28px;
    color:white;
    margin-top:10px;
    height:40px;
}
</style>
</head>
<body>

<h1>⚽ Jogo de Pênalti PRO</h1>

<div class="campo">

    <div class="area"></div>
    <div class="pequena"></div>
    <div class="marca"></div>
    <div class="gol"></div>

    <div class="goleiro" id="goleiro">
        <div class="cabeca"></div>
        <div class="corpo"></div>
        <div class="bracos"></div>
        <div class="pernas"></div>
    </div>

    <div class="bola" id="bola">⚽</div>

</div>

<div class="botoes">
    <button onclick="chutar('esquerda')">Esquerda</button>
    <button onclick="chutar('centro')">Centro</button>
    <button onclick="chutar('direita')">Direita</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;

function chutar(direcao){

    if(animando) return;
    animando = true;

    const goleiro = document.getElementById("goleiro");
    const bola = document.getElementById("bola");
    const resultado = document.getElementById("resultado");

    const opcoes = ["esquerda","centro","direita"];
    const defesa = opcoes[Math.floor(Math.random()*3)];

    resultado.innerHTML = "";

    // RESET
    goleiro.style.left = "50%";
    goleiro.style.transform = "translateX(-50%) rotate(0deg)";
    bola.style.left = "50%";
    bola.style.transform = "translateX(-50%)";
    bola.style.bottom = "80px";

    setTimeout(()=>{

        if(direcao==="esquerda"){
            bola.style.left="40%";
        }
        if(direcao==="direita"){
            bola.style.left="60%";
        }

        bola.style.bottom="300px";

        if(defesa==="esquerda"){
            goleiro.style.left="40%";
            goleiro.style.transform="translateX(-50%) rotate(-25deg)";
        }
        if(defesa==="direita"){
            goleiro.style.left="60%";
            goleiro.style.transform="translateX(-50%) rotate(25deg)";
        }

    },100);

    setTimeout(()=>{

        if(direcao===defesa){
            resultado.innerHTML="🧤 DEFENDEU!";
        }else{
            resultado.innerHTML="⚽ GOOOOOL!";
        }

        animando=false;

    },600);
}

</script>

</body>
</html>
