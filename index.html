<!DOCTYPE html>
<html>
<head>
    <title>Jogo de Pênalti PRO</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to top, #2ecc71 70%, #87ceeb 30%);
            overflow: hidden;
        }

        h1 {
            color: white;
            margin-top: 10px;
        }

        .campo {
            position: relative;
            width: 700px;
            height: 450px;
            margin: 20px auto;
            background: #27ae60;
            border: 4px solid white;
            border-bottom: none;
        }

        .gol {
            position: absolute;
            top: 40px;
            left: 200px;
            width: 300px;
            height: 150px;
            border: 5px solid white;
        }

        .goleiro {
            position: absolute;
            top: 110px;
            left: 325px;
            font-size: 60px;
            transition: all 0.4s ease;
        }

        .bola {
            position: absolute;
            bottom: 40px;
            left: 340px;
            font-size: 45px;
            transition: all 0.4s ease;
        }

        .botoes {
            margin-top: 15px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #resultado {
            font-size: 28px;
            color: white;
            margin-top: 10px;
            height: 40px;
        }
    </style>
</head>
<body>

<h1>⚽ Jogo de Pênalti PRO</h1>

<div class="campo">
    <div class="gol"></div>
    <div class="goleiro" id="goleiro">🧤</div>
    <div class="bola" id="bola">⚽</div>
</div>

<div class="botoes">
    <button onclick="chutar('esquerda')" id="btn1">Esquerda</button>
    <button onclick="chutar('centro')" id="btn2">Centro</button>
    <button onclick="chutar('direita')" id="btn3">Direita</button>
</div>

<div id="resultado"></div>

<script>

let animando = false;

function desativarBotoes(valor){
    document.getElementById("btn1").disabled = valor;
    document.getElementById("btn2").disabled = valor;
    document.getElementById("btn3").disabled = valor;
}

function chutar(direcaoJogador){

    if(animando) return;
    animando = true;
    desativarBotoes(true);

    const goleiro = document.getElementById("goleiro");
    const bola = document.getElementById("bola");
    const resultado = document.getElementById("resultado");

    const opcoes = ['esquerda','centro','direita'];
    const direcaoGoleiro = opcoes[Math.floor(Math.random()*3)];

    resultado.innerHTML = "";

    // POSIÇÕES INICIAIS
    goleiro.style.left = "325px";
    bola.style.left = "340px";
    bola.style.bottom = "40px";

    setTimeout(()=>{

        // MOVIMENTO BOLA
        if(direcaoJogador === "esquerda") bola.style.left = "250px";
        if(direcaoJogador === "centro") bola.style.left = "340px";
        if(direcaoJogador === "direita") bola.style.left = "430px";

        bola.style.bottom = "260px";

        // MOVIMENTO GOLEIRO
        if(direcaoGoleiro === "esquerda") goleiro.style.left = "250px";
        if(direcaoGoleiro === "centro") goleiro.style.left = "325px";
        if(direcaoGoleiro === "direita") goleiro.style.left = "400px";

    },100);

    setTimeout(()=>{

        if(direcaoJogador === direcaoGoleiro){
            resultado.innerHTML = "🧤 DEFENDEU!";
        } else {
            resultado.innerHTML = "⚽ GOOOOOL!";
        }

    },500);

    setTimeout(()=>{

        // RESET
        goleiro.style.left = "325px";
        bola.style.left = "340px";
        bola.style.bottom = "40px";

        animando = false;
        desativarBotoes(false);

    },1000);
}

</script>

</body>
</html>
